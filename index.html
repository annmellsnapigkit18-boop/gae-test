<!DOCTYPE html>
<html>
<head>
<style>
body {
    text-align: center;
    font-family: Arial;
    margin-top: 100px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    margin: 10px;
}

#yes {
    background: pink;
}

#no {
    background: lightgray;
    position: absolute;
}
</style>
</head>

<body>

<h1>Do you love me? ❤️</h1>

<button id="yes" onclick="yes()">YES ❤️</button>
<button id="no">NO 😭</button>

<p id="answer"></p>

<script>
function yes() {
    document.getElementById("answer").innerHTML =
    "I knew it! ❤️🥹";
}

const no = document.getElementById("no");

function moveNo() {
    const x = Math.random() * (window.innerWidth - no.offsetWidth);
    const y = Math.random() * (window.innerHeight - no.offsetHeight);

    no.style.left = x + "px";
    no.style.top = y + "px";
}

no.addEventListener("mouseover", moveNo);
no.addEventListener("touchstart", moveNo);
</script>

</body>
</html>
