<!DOCTYPE html>
<html>
<head>
<style>
body {
    text-align: center;
    font-family: Arial;
    margin-top: 100px;
    background-image: url("IMG_20260614_172738.jpg");
    background-size: cover;
    background-position: center;
    min-height: 100vh;
}
    h1 {
    font-size: 50px;
    }

button {
    padding: 60px 70px;
    font-size: 50px;
    border: none;
    border-radius: 12px;
    margin: 10px;
}

#yes {
    background: pink;
}

#no {
    background: red;
    position: absolute;
}
    #answer {
    font-size: 70px;
    font-weight: bold;
    }
</style>
</head>

<body>

<h1>are tou gae🤔? </h1>

<button id="yes" onclick="yes()">YES 💀</button>
<button id="no">NO 😭</button>

<p id="answer"></p>

<script>
function yes() {
    document.getElementById("answer").innerHTML =
    "We know you're gae lil bro, don't try to hide it! ❤️🥹";
}

const no = document.getElementById("no");

function moveNo() {
    const x = Math.random() * (window.innerWidth - no.offsetWidth);
    const y = Math.random() * (window.innerHeight - no.offsetHeight);

    no.style.left = x + "px";
    no.style.top = y + "px";
}

no.addEventListener("mouseover", moveNo);
no.addEventListener("touchstart", moveNo);
</script>

</body>
</html>
